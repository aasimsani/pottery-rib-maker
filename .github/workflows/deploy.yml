name: Deploy

# Deploys run only when someone starts this workflow from the Actions tab, so a push never publishes.
# To deploy on every push to main, add `push: { branches: [main] }` under `on`.
on:
  workflow_dispatch:

# A newer run cancels a deploy that has not finished, so an older build never lands last.
concurrency:
  group: deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      - run: npx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
