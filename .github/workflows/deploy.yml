name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

# A newer push cancels a deploy that has not finished, so an older build never lands last.
concurrency:
  group: deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      # The Turnstile site key is public, so it lives in a repository variable. The build bakes it into the page.
      VITE_TURNSTILE_SITE_KEY: ${{ vars.TURNSTILE_SITE_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      # Without the real key the page would fall back to Cloudflare's always-pass test key, so the deploy stops instead.
      - run: test -n "$VITE_TURNSTILE_SITE_KEY" || { echo "Set the TURNSTILE_SITE_KEY repository variable first."; exit 1; }
      - run: npm ci
      - run: npm test
      - run: npm run build
      - run: npx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      # The Worker checks each person-check token with this secret. Setting it on every deploy keeps GitHub the one place it lives.
      - run: printf '%s' "$TURNSTILE_SECRET" | npx wrangler secret put TURNSTILE_SECRET
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          TURNSTILE_SECRET: ${{ secrets.TURNSTILE_SECRET }}
